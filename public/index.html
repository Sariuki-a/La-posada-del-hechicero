<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Posada del Hechicero - Inicio</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <script>
  // Fetch y mostrar productos con más stock
  async function cargarDestacados() {
    try {
      const res = await fetch('https://la-posada-del-hechicero.onrender.com/api/products');
      const productos = await res.json();
      const destacados = productos
        .sort((a, b) => b.stock - a.stock)
        .slice(0, 6);

      const contenedor = document.getElementById('featured-products');
      destacados.forEach(p => {
        const div = document.createElement('div');
        div.classList.add('product');
        div.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <strong>$${p.price}</strong>
          <span class="stock">Stock: ${p.stock}</span>
        `;
        contenedor.appendChild(div);
      });
    } catch (err) {
      console.error('Error al cargar productos destacados:', err);
    }
  }

  cargarDestacados();
</script>

<body>
  <header>
    <div class="header-content">
      <h1>La Posada del Hechicero</h1>
      <p>Tienda de cartas TCG, juegos de mesa y accesorios</p>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="tcg.html">Cartas TCG</a></li>
      <li><a href="juegos-mesa.html">Juegos de Mesa</a></li>
      <li><a href="accesorios.html">Accesorios</a></li>
    </ul>
  </nav>

  <main>
    <section class="reveal">
      <h2>Bienvenido a La Posada del Hechicero</h2>
      <p>Explora nuestras categorías y sumérgete en el mundo del coleccionismo y la estrategia.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 La Posada del Hechicero</p>
  </footer>

  <script>
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    });
    reveals.forEach(r => observer.observe(r));
  </script>
</body>
</html>
